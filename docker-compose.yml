# Runs the Next.js app against the existing hosted Supabase project - no
# local database. NEXT_PUBLIC_* vars must be present at build time (Compose
# reads them for `args` from its own environment), SUPABASE_SERVICE_ROLE_KEY
# only needs to be present at container runtime (via env_file below).
#
# Usage: docker compose --env-file .env.local up --build
services:
  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
    ports:
      - "3000:3000"
    env_file:
      - .env.local
    restart: unless-stopped
