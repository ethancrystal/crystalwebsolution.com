<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>3D Animation Viewer</title>

<!-- ============================================================= -->
<!-- FIXED: importmap loads Three.js + OrbitControls from CDN.     -->
<!-- No build step. Bump the version together if you change it.    -->
<!-- ============================================================= -->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<style>
  /* FIXED: layout + control-sidebar styling. Safe to retheme colors,
     but keep the structure (canvas fills screen, sidebar overlays). */
  :root {
    --bg: #0b0d12;
    --panel: rgba(20, 24, 33, 0.82);
    --stroke: rgba(255, 255, 255, 0.10);
    --text: #e7ecf3;
    --muted: #9aa7b8;
    --accent: #6ea8fe;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); }
  #app { position: fixed; inset: 0; }
  canvas { display: block; }

  #sidebar {
    position: fixed; top: 16px; right: 16px; width: 250px;
    max-height: calc(100vh - 32px); overflow-y: auto;
    background: var(--panel); backdrop-filter: blur(10px);
    border: 1px solid var(--stroke); border-radius: 14px;
    padding: 16px; color: var(--text);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 13px; user-select: none; z-index: 10;
  }
  #sidebar h1 { font-size: 14px; margin: 0 0 2px; font-weight: 600; letter-spacing: .2px; }
  #sidebar .sub { color: var(--muted); font-size: 11px; margin: 0 0 14px; }
  .section-label { color: var(--muted); font-size: 10px; letter-spacing: 1px;
    text-transform: uppercase; margin: 16px 0 8px; }
  .control-group { margin-bottom: 12px; }
  .control-group label { display: flex; justify-content: space-between;
    margin-bottom: 5px; color: var(--text); }
  .control-group .value-display { color: var(--accent); font-variant-numeric: tabular-nums; }
  input[type="range"] { width: 100%; accent-color: var(--accent); }
  input[type="color"] { width: 100%; height: 30px; border: 1px solid var(--stroke);
    border-radius: 8px; background: transparent; cursor: pointer; }
  .row { display: flex; gap: 8px; }
  .row.wrap { flex-wrap: wrap; }
  button {
    flex: 1; padding: 9px 10px; border: 1px solid var(--stroke);
    background: rgba(255,255,255,0.05); color: var(--text);
    border-radius: 9px; cursor: pointer; font-size: 12px; transition: background .15s;
  }
  button:hover { background: rgba(255,255,255,0.12); }
  .toggle { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .toggle input { width: 16px; height: 16px; accent-color: var(--accent); }
</style>
</head>
<body>
<div id="app"></div>

<!-- ============================================================= -->
<!-- SIDEBAR — FIXED sections (Playback, Actions) always present.  -->
<!-- Replace only the "Parameters" / "Colors" controls per scene.  -->
<!-- ============================================================= -->
<div id="sidebar">
  <h1>3D Animation</h1>
  <p class="sub">Drag to orbit · scroll to zoom</p>

  <!-- VARIABLE: Parameters — swap these controls for your scene. -->
  <div class="section-label">Parameters</div>

  <div class="control-group">
    <label>Speed <span class="value-display" id="speed-value">1.0</span></label>
    <input type="range" id="speed" min="0" max="3" step="0.05" value="1"
           oninput="setParam('speed', +this.value)">
  </div>

  <div class="control-group">
    <label>Detail <span class="value-display" id="detail-value">1</span></label>
    <input type="range" id="detail" min="0" max="4" step="1" value="1"
           oninput="setParam('detail', +this.value)">
  </div>

  <div class="toggle">
    <label style="margin:0">Wireframe</label>
    <input type="checkbox" id="wireframe" onchange="setParam('wireframe', this.checked)">
  </div>

  <div class="toggle">
    <label style="margin:0">Auto-orbit</label>
    <input type="checkbox" id="autoRotate" checked onchange="setParam('autoRotate', this.checked)">
  </div>

  <!-- VARIABLE: Colors — keep, retheme, or remove per scene. -->
  <div class="section-label">Colors</div>
  <div class="control-group">
    <label>Object</label>
    <input type="color" id="color" value="#6ea8fe" oninput="setParam('color', this.value)">
  </div>
  <div class="control-group">
    <label>Rim light</label>
    <input type="color" id="rim" value="#ff5d8f" oninput="setParam('rim', this.value)">
  </div>

  <!-- FIXED: Playback + Actions. -->
  <div class="section-label">Playback</div>
  <div class="row wrap">
    <button id="playBtn" onclick="togglePlay()">Pause</button>
    <button onclick="resetScene()">Reset</button>
    <button onclick="downloadPNG()">Save PNG</button>
  </div>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ================================================================
   FIXED SCAFFOLD — renderer, camera, lights, loop, resize, UI glue.
   You normally leave this block alone.
   ================================================================ */
const container = document.getElementById('app');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b0d12);
scene.fog = new THREE.Fog(0x0b0d12, 8, 22);

const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 100);
camera.position.set(0, 1.2, 6);

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));   // FIXED: clamp DPR for perf
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
container.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.autoRotateSpeed = 0.8;

// Three-point light rig — key + ambient fill + colored rim.
const ambient = new THREE.AmbientLight(0xffffff, 0.35);
const key = new THREE.DirectionalLight(0xffffff, 1.6);
key.position.set(5, 6, 4);
const rimLight = new THREE.DirectionalLight(0xff5d8f, 1.4);
rimLight.position.set(-6, -2, -4);
scene.add(ambient, key, rimLight);

/* ================================================================
   VARIABLE — the scene. Replace params + buildScene + update
   for each new animation. This default is an animated hero object.
   ================================================================ */
const params = {
  speed: 1.0,
  detail: 1,
  wireframe: false,
  autoRotate: true,
  color: '#6ea8fe',
  rim: '#ff5d8f',
};

let hero, material;

function buildScene() {
  // Dispose old geometry/material so rebuilds don't leak GPU memory.
  if (hero) { hero.geometry.dispose(); material.dispose(); scene.remove(hero); }

  const geo = new THREE.IcosahedronGeometry(1.6, params.detail);
  material = new THREE.MeshStandardMaterial({
    color: params.color,
    metalness: 0.35,
    roughness: 0.25,
    wireframe: params.wireframe,
    flatShading: params.detail === 0,
  });
  hero = new THREE.Mesh(geo, material);
  scene.add(hero);
}

// Called every frame. delta = seconds since last frame, t = total seconds.
function update(delta, t) {
  if (!hero) return;
  // Layered timing: two spin axes + a buoyant bob = organic, non-mechanical loop.
  hero.rotation.y += delta * 0.6 * params.speed;
  hero.rotation.x += delta * 0.25 * params.speed;
  hero.position.y = Math.sin(t * 1.2 * params.speed) * 0.15;
  const breathe = 1 + Math.sin(t * 0.9 * params.speed) * 0.04;
  hero.scale.setScalar(breathe);
}

// Push a changed param into the live scene (called by UI + on load).
function applyParams() {
  controls.autoRotate = params.autoRotate;
  rimLight.color.set(params.rim);
  if (material) {
    material.color.set(params.color);
    material.wireframe = params.wireframe;
  }
}

/* ================================================================
   FIXED — animation loop, playback, resize, UI bridge, actions.
   ================================================================ */
const clock = new THREE.Clock();
let playing = true;
let elapsed = 0;   // our own clock so Pause freezes motion with no resume-jump

function animate() {
  requestAnimationFrame(animate);
  const delta = clock.getDelta();
  if (playing) { elapsed += delta; update(delta, elapsed); }
  controls.update();               // orbit stays live even while paused
  renderer.render(scene, camera);
}

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// Exposed to the sidebar (inline handlers).
window.setParam = (k, v) => {
  params[k] = v;
  const el = document.getElementById(k + '-value');
  if (el) el.textContent = typeof v === 'number' ? (Number.isInteger(v) ? v : v.toFixed(1)) : v;
  if (k === 'detail') buildScene();
  applyParams();
};
window.togglePlay = () => {
  playing = !playing;
  document.getElementById('playBtn').textContent = playing ? 'Pause' : 'Play';
};
window.resetScene = () => {
  Object.assign(params, {
    speed: 1.0, detail: 1, wireframe: false, autoRotate: true,
    color: '#6ea8fe', rim: '#ff5d8f',
  });
  document.getElementById('speed').value = 1;      document.getElementById('speed-value').textContent = '1.0';
  document.getElementById('detail').value = 1;     document.getElementById('detail-value').textContent = '1';
  document.getElementById('wireframe').checked = false;
  document.getElementById('autoRotate').checked = true;
  document.getElementById('color').value = '#6ea8fe';
  document.getElementById('rim').value = '#ff5d8f';
  camera.position.set(0, 1.2, 6); controls.target.set(0, 0, 0);
  buildScene(); applyParams();
};
window.downloadPNG = () => {
  renderer.render(scene, camera);   // ensure the current frame is in the buffer
  const a = document.createElement('a');
  a.download = '3d-animation.png';
  a.href = renderer.domElement.toDataURL('image/png');
  a.click();
};

// Boot.
buildScene();
applyParams();
animate();
</script>
</body>
</html>
