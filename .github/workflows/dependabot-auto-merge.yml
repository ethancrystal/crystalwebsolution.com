name: Dependabot auto-merge

on:
  pull_request:
    branches: [main]
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      - edited

permissions:
  contents: read
  pull-requests: read

jobs:
  release-policy:
    name: release-policy
    runs-on: ubuntu-latest
    steps:
      - name: Validate release metadata
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const { owner, repo } = context.repo;
            const fail = (message) => core.setFailed(message);

            const titleMatch = /^v(\d+)\.(\d{2}) — .+$/u.exec(pr.title);
            if (!titleMatch) {
              fail('PR title must start with the release version, an em dash, and a summary (for example: v1.83 — update dependencies).');
              return;
            }

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner,
              repo,
              pull_number: pr.number,
              per_page: 100,
            });
            const changed = new Set(files.map((file) => file.filename));
            for (const path of ['VERSION', 'CHANGELOG.md']) {
              if (!changed.has(path)) {
                fail(`This main-branch PR must modify ${path} in the same PR.`);
                return;
              }
            }

            async function readText(path, ref) {
              const { data } = await github.rest.repos.getContent({ owner, repo, path, ref });
              if (Array.isArray(data) || data.type !== 'file' || data.encoding !== 'base64') {
                throw new Error(`Could not read ${path} at ${ref} as a regular file.`);
              }
              return Buffer.from(data.content, 'base64').toString('utf8').replace(/\r\n/g, '\n').trimEnd();
            }

            const [baseText, headText, changelog] = await Promise.all([
              readText('VERSION', pr.base.ref),
              readText('VERSION', pr.head.sha),
              readText('CHANGELOG.md', pr.head.sha),
            ]);
            const versionPattern = /^v(\d+)\.(\d{2})$/;
            const baseMatch = versionPattern.exec(baseText.trim());
            const headMatch = versionPattern.exec(headText.trim());
            if (!baseMatch || !headMatch) {
              fail('VERSION must contain a single version in the format vMAJOR.NN.');
              return;
            }

            const baseMajor = Number(baseMatch[1]);
            const baseMinor = Number(baseMatch[2]);
            if (baseMinor >= 99) {
              fail('Automatic release numbering is paused at .99; a major-version transition requires owner direction.');
              return;
            }
            const expectedVersion = `v${baseMajor}.${String(baseMinor + 1).padStart(2, '0')}`;
            const headVersion = headText.trim();
            const titleVersion = `v${titleMatch[1]}.${titleMatch[2]}`;
            if (headVersion !== expectedVersion || titleVersion !== expectedVersion) {
              fail(`VERSION and PR title must use the next release number, ${expectedVersion}, based on the current main branch.`);
              return;
            }

            const lines = changelog.split('\n');
            const headingIndex = lines.findIndex((line) => line.trim().length > 0);
            const heading = headingIndex >= 0 ? lines[headingIndex].trim() : '';
            const changelogMatch = /^## (v\d+\.\d{2}) — (\d{4}-\d{2}-\d{2})$/u.exec(heading);
            if (!changelogMatch || changelogMatch[1] !== headVersion) {
              fail(`CHANGELOG.md must start with a heading for ${headVersion} in the format "## ${headVersion} — YYYY-MM-DD".`);
              return;
            }
            const nextHeading = lines.findIndex((line, index) => index > headingIndex && /^##\s/.test(line));
            const sectionBody = lines.slice(headingIndex + 1, nextHeading < 0 ? lines.length : nextHeading);
            if (!sectionBody.some((line) => line.trim().length > 0)) {
              fail('The new top CHANGELOG.md entry must include a short summary of the change.');
              return;
            }

            core.notice(`Release metadata is valid for ${headVersion}.`);

  enable-dependabot-auto-merge:
    name: enable-dependabot-auto-merge
    needs: release-policy
    if: github.event.pull_request.user.login == 'dependabot[bot]' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Fetch Dependabot update metadata
        id: metadata
        uses: dependabot/fetch-metadata@21025c705c08248db411dc16f3619e6b5f9ea21a
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge for minor and patch updates
        if: steps.metadata.outputs.update-type == 'version-update:semver-minor' || steps.metadata.outputs.update-type == 'version-update:semver-patch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --merge "$PR_URL"
