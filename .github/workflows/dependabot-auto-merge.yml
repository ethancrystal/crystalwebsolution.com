name: Dependabot auto-merge

on:
  pull_request:
    branches: [main]
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      - edited

permissions:
  contents: read
  pull-requests: read

jobs:
  release-policy:
    name: release-policy
    runs-on: ubuntu-latest
    steps:
      # The rules live in scripts/release-policy.mjs (unit-tested in
      # tests/release-policy.test.mjs); this job only gathers the inputs.
      - name: Check out the policy script
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate release metadata
        uses: actions/github-script@v7
        with:
          script: |
            const { validateRelease } = await import('${{ github.workspace }}/scripts/release-policy.mjs');
            const pr = context.payload.pull_request;
            const { owner, repo } = context.repo;

            async function readText(path, ref) {
              const { data } = await github.rest.repos.getContent({ owner, repo, path, ref });
              if (Array.isArray(data) || data.type !== 'file' || data.encoding !== 'base64') {
                throw new Error(`Could not read ${path} at ${ref} as a regular file.`);
              }
              return Buffer.from(data.content, 'base64').toString('utf8').replace(/\r\n/g, '\n').trimEnd();
            }

            const [files, baseVersion, headVersion, headChangelog, mainChangelog, commits, pulls] = await Promise.all([
              github.paginate(github.rest.pulls.listFiles, { owner, repo, pull_number: pr.number, per_page: 100 }),
              readText('VERSION', pr.base.ref),
              readText('VERSION', pr.head.sha),
              readText('CHANGELOG.md', pr.head.sha),
              readText('CHANGELOG.md', pr.base.ref),
              github.rest.repos.listCommits({ owner, repo, sha: pr.base.ref, per_page: 100 }),
              github.paginate(github.rest.pulls.list, { owner, repo, state: 'open', base: pr.base.ref, per_page: 100 }),
            ]);

            const result = validateRelease({
              title: pr.title,
              number: pr.number,
              changedFiles: files.map((file) => file.filename),
              baseVersion,
              headVersion,
              headChangelog,
              mainChangelog,
              mainCommitMessages: commits.data.map((commit) => commit.commit.message),
              otherOpenPulls: pulls
                .filter((pull) => pull.number !== pr.number)
                .map((pull) => ({ number: pull.number, title: pull.title })),
            });

            if (result.ok) core.notice(result.notice);
            else core.setFailed(result.message);

  enable-dependabot-auto-merge:
    name: enable-dependabot-auto-merge
    needs: release-policy
    if: github.event.pull_request.user.login == 'dependabot[bot]' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Fetch Dependabot update metadata
        id: metadata
        uses: dependabot/fetch-metadata@21025c705c08248db411dc16f3619e6b5f9ea21a
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge for minor and patch updates
        if: steps.metadata.outputs.update-type == 'version-update:semver-minor' || steps.metadata.outputs.update-type == 'version-update:semver-patch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --merge "$PR_URL"
